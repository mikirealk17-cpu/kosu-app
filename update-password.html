<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パスワード再設定</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container app-shell">
    <header class="screen-header">
      <div>
        <p class="screen-kicker">Kosu Tracker</p>
        <h1>パスワード再設定</h1>
      </div>
      <span class="screen-badge">ログイン復旧</span>
    </header>

    <main class="panel auth-panel">
      <div class="panel-header">
        <div>
          <h2>新しいパスワード</h2>
          <p>再設定メールのリンクから開いた場合だけ、新しいパスワードを登録できます。</p>
        </div>
      </div>

      <form id="update_password_form">
        <div class="form-group">
          <label>新しいパスワード</label>
          <input type="password" id="new_password" autocomplete="new-password" minlength="6" required>
        </div>

        <div class="form-group">
          <label>新しいパスワード（確認）</label>
          <input type="password" id="confirm_password" autocomplete="new-password" minlength="6" required>
        </div>

        <button class="primary-action" type="submit">更新する</button>
        <a class="secondary-link auth-return-link" href="login.html">ログインへ戻る</a>
      </form>

      <p class="auth-help">リンクの有効期限が切れている場合は、ログイン画面から再設定メールを送り直してください。</p>
      <div id="message" role="status" aria-live="polite"></div>
    </main>
  </div>

  <script src="update-password.js" type="module"></script>
</body>
</html>
